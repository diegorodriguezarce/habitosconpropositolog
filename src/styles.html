<style>
  /* Marca Hábitos con propósito: cambie estas variables para ajustar todo el estilo. */
  :root {
    --crema: #F7F2E8;
    --papel: #FFFDF8;
    --linea: #E6DECD;
    --verde-claro: #D2DCA1;
    --salvia: #A8B77A;
    --salvia-suave: #E4EACB;
    --oscuro: #304323;
    --amarillo: #F4D978;
    --amarillo-suave: #FBF0C6;
    --gris-verde: #939A85;
    --texto: #2A2B26;
    --muted: #6E6C64;
    --rojo: #A84A2A;
    --rojo-suave: #F6E2D8;

    --fuente-logo: 'DM Serif Display', Georgia, serif;
    --fuente-titulo: 'Poppins', system-ui, sans-serif;
    --fuente: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;

    --radio: 16px;
    --radio-sm: 12px;
    --sombra: 0 1px 2px rgba(48, 67, 35, .05), 0 6px 18px rgba(48, 67, 35, .06);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--crema);
    color: var(--texto);
    font-family: var(--fuente);
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
    overflow-x: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .oculto { display: none !important; }

  /* Formas decorativas como en las publicaciones */
  .blob { position: fixed; z-index: 0; pointer-events: none; background: var(--verde-claro); }
  .blob-tr { width: 240px; height: 240px; border-radius: 50%; top: -120px; right: -110px; }
  .blob-bl { width: 190px; height: 170px; bottom: -70px; left: -70px;
    border-radius: 58% 42% 55% 45% / 52% 60% 40% 48%; }

  /* ───────── Encabezado ───────── */
  .topbar {
    position: relative; z-index: 2;
    max-width: 760px; margin: 0 auto;
    padding: 18px 16px 6px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .logo { font-family: var(--fuente-logo); line-height: .95; letter-spacing: -.2px; }
  .logo-1 { display: block; color: var(--gris-verde); font-size: 30px; }
  .logo-2 { display: block; color: var(--salvia); font-size: 30px; }
  .saludo { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

  .tabs {
    display: flex; gap: 4px; padding: 4px;
    background: var(--papel); border: 1px solid var(--linea); border-radius: 999px;
    box-shadow: var(--sombra);
  }
  .tab {
    flex: 1; border: 0; background: transparent; cursor: pointer;
    padding: 9px 10px; border-radius: 999px;
    font-family: var(--fuente-titulo); font-weight: 600; font-size: 14px; color: var(--oscuro);
  }
  .tab.activa { background: var(--oscuro); color: var(--crema); }

  main { position: relative; z-index: 1; padding: 6px 16px 120px; }
  .vista { display: none; max-width: 760px; margin: 0 auto; }
  .vista.activa { display: block; }
  .vista-ancha { max-width: 1120px; }

  .titulo {
    position: relative;
    font-family: var(--fuente-titulo); font-weight: 700; color: var(--oscuro);
    font-size: 26px; line-height: 1.2; margin: 18px 0 14px 34px;
  }
  .chispas { position: absolute; left: -36px; top: -10px; width: 30px; height: 30px; color: var(--amarillo); }
  .pill { background: var(--salvia); border-radius: 12px; padding: 0 12px 2px; display: inline-block; }

  /* ───────── Tarjetas y campos ───────── */
  .card {
    background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio);
    padding: 16px; margin-bottom: 14px; box-shadow: var(--sombra);
  }
  .card h2 {
    font-family: var(--fuente-titulo); font-weight: 600; font-size: 16px; color: var(--oscuro);
    margin: 0 0 12px;
  }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .sutil { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

  .campo { display: block; margin-bottom: 14px; min-width: 0; }
  .campo:last-child { margin-bottom: 0; }
  .campo > span { display: block; font-size: 13px; font-weight: 600; color: var(--oscuro); margin-bottom: 6px; }
  .campo em { font-weight: 400; color: var(--muted); font-style: normal; }
  input[type=text], input[type=date], input[type=time], input[type=number], input[type=month], select, textarea {
    width: 100%; min-width: 0;
    background: #fff; border: 1.5px solid var(--linea); border-radius: var(--radio-sm);
    padding: 11px 12px; font-size: 16px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--salvia); box-shadow: 0 0 0 3px var(--salvia-suave); }
  input.error, .chips.error { border-color: var(--rojo) !important; box-shadow: 0 0 0 3px var(--rojo-suave); border-radius: var(--radio-sm); }
  textarea { resize: vertical; }
  .ayuda { display: block; margin-top: 6px; font-size: 12.5px; color: var(--muted); min-height: 1em; }
  .ayuda.nuevo { color: #7A6213; }
  .ayuda.recurrente { color: var(--oscuro); }

  .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fila2 .campo { margin-bottom: 14px; }

  .monto { position: relative; }
  .monto::before {
    content: '₡'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-weight: 600; pointer-events: none;
  }
  .monto input { padding-left: 28px; font-weight: 600; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  /* Chips de selección */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid var(--linea); background: #fff; color: var(--oscuro);
    border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 500; font-size: 14px;
    transition: background .15s, border-color .15s;
  }
  .chip:hover { border-color: var(--salvia); }
  .chip[aria-pressed=true] { background: var(--salvia); border-color: var(--salvia); font-weight: 700; }
  .chips-sm .chip { padding: 6px 12px; font-size: 13.5px; }
  .chips-sino .chip { min-width: 70px; }

  .pago { display: grid; grid-template-columns: minmax(0, 170px) 1fr; gap: 12px; align-items: start; }
  .pago .campo { margin-bottom: 12px; }

  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: var(--oscuro); font-weight: 500; margin: 4px 0 12px; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch-ui { width: 40px; height: 24px; border-radius: 999px; background: var(--linea); position: relative; transition: background .15s; flex: none; }
  .switch-ui::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
  .switch input:checked + .switch-ui { background: var(--salvia); }
  .switch input:checked + .switch-ui::after { transform: translateX(16px); }
  .switch input:focus-visible + .switch-ui { box-shadow: 0 0 0 3px var(--salvia-suave); }

  .aviso { background: var(--amarillo-suave); border-radius: var(--radio-sm); padding: 8px 12px; font-size: 13px; color: #5E4B0E; margin: 0; }

  /* Citas del calendario */
  .eventos { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
  .evento {
    flex: 0 0 auto; width: 170px; text-align: left; scroll-snap-align: start;
    background: #fff; border: 1.5px solid var(--linea); border-radius: var(--radio-sm);
    padding: 10px 12px; cursor: pointer; position: relative;
  }
  .evento:hover { border-color: var(--salvia); }
  .evento.sel { border-color: var(--oscuro); box-shadow: 0 0 0 2px var(--oscuro) inset; }
  .evento.hecho { opacity: .6; }
  .evento-hora { font-family: var(--fuente-titulo); font-weight: 700; color: var(--oscuro); font-size: 14px; }
  .evento-titulo { font-size: 13px; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .evento-lugar { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evento-badge { position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 700; color: var(--oscuro); background: var(--verde-claro); border-radius: 999px; padding: 1px 7px; }
  .evento-fuente { font-size: 10.5px; color: var(--gris-verde); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; margin-left: 4px; }
  .vacio { color: var(--muted); font-size: 13.5px; margin: 0; }

  /* Barra inferior fija */
  .barra-guardar {
    position: sticky; bottom: 12px; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--oscuro); color: var(--crema);
    border-radius: 20px; padding: 10px 10px 10px 18px; box-shadow: 0 10px 30px rgba(48,67,35,.25);
  }
  .resumen { display: flex; flex-direction: column; min-width: 0; }
  .resumen-total { font-family: var(--fuente-titulo); font-weight: 700; font-size: 20px; line-height: 1.1; }
  .resumen-det { font-size: 12px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acciones { display: flex; gap: 8px; flex: none; }

  .btn {
    border: 0; border-radius: 14px; padding: 12px 20px; cursor: pointer;
    font-family: var(--fuente-titulo); font-weight: 600; font-size: 15px;
  }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn-pri { background: var(--salvia); color: var(--oscuro); }
  .btn-pri:hover { background: #B6C489; }
  .card .btn-pri, .modal .btn-pri { background: var(--oscuro); color: var(--crema); }
  .btn-sec { background: transparent; color: inherit; border: 1.5px solid currentColor; }
  .btn-link { background: none; border: 0; cursor: pointer; text-decoration: underline; font-size: 14px; padding: 12px 0; color: var(--oscuro); }
  .peligro { color: var(--rojo); }
  .btn-icono {
    width: 38px; height: 42px; border-radius: var(--radio-sm); border: 1.5px solid var(--linea);
    background: var(--papel); cursor: pointer; font-size: 20px; color: var(--oscuro);
  }

  /* ───────── Recientes ───────── */
  .lista { display: flex; flex-direction: column; gap: 10px; }
  .reg {
    background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio);
    padding: 12px 14px; box-shadow: var(--sombra); cursor: pointer; text-align: left; width: 100%;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 12px;
  }
  .reg:hover { border-color: var(--salvia); }
  .reg-fecha { font-size: 12.5px; color: var(--muted); }
  .reg-nombre { font-weight: 700; color: var(--oscuro); font-size: 15px; }
  .reg-meta { font-size: 13px; color: var(--muted); }
  .reg-monto { grid-row: 1 / span 3; grid-column: 2; align-self: center; text-align: right; font-family: var(--fuente-titulo); font-weight: 700; color: var(--oscuro); }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 8px; background: var(--salvia-suave); color: var(--oscuro); margin-left: 4px; vertical-align: 1px; }
  .tag.Pendiente { background: var(--amarillo-suave); color: #6A5310; }
  .tag.Facturado { background: #E7ECF3; color: #34495E; }
  .tag.Pagado { background: var(--verde-claro); }

  /* ───────── Reportes ───────── */
  .rep-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
  .rep-mes { display: flex; gap: 6px; align-items: center; }
  .rep-mes input { width: 170px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px 16px; box-shadow: var(--sombra); }
  .kpi-label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .kpi-valor { font-family: var(--fuente-titulo); font-weight: 700; font-size: 22px; color: var(--oscuro); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi-sub { font-size: 12px; color: var(--muted); }
  .kpi.destacado { background: var(--oscuro); border-color: var(--oscuro); }
  .kpi.destacado .kpi-label, .kpi.destacado .kpi-sub { color: var(--verde-claro); }
  .kpi.destacado .kpi-valor { color: var(--crema); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
  .tabla-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1.5px solid var(--linea); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
  td.num, th.num { text-align: right; }
  tr.total td { font-weight: 700; color: var(--oscuro); border-bottom: 0; }
  td .sub { display: block; font-size: 11.5px; color: var(--muted); white-space: normal; }
  .acc-mini { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .btn-mini { border: 1.5px solid var(--oscuro); background: transparent; color: var(--oscuro); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }

  .export-form { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .export-form .campo { margin: 0; flex: 1 1 260px; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; padding-bottom: 12px; }
  .check input { width: 18px; height: 18px; accent-color: var(--oscuro); }
  .export-res { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .export-item { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; background: var(--salvia-suave); border-radius: var(--radio-sm); padding: 10px 12px; font-size: 14px; }
  .export-item strong { color: var(--oscuro); margin-right: auto; }
  .export-item a { color: var(--oscuro); font-weight: 600; }

  /* ───────── Avisos ───────── */
  .toast {
    position: fixed; left: 50%; top: 14px; transform: translate(-50%, calc(-100% - 30px)); z-index: 50;
    visibility: hidden;
    background: var(--oscuro); color: var(--crema); padding: 11px 18px; border-radius: 14px;
    font-weight: 600; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2);
    transition: transform .25s ease, visibility .25s; max-width: calc(100% - 32px);
  }
  .toast.ver { transform: translate(-50%, 0); visibility: visible; }
  .toast.error { background: var(--rojo); color: #fff; }
  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(42, 43, 38, .45); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-caja { background: var(--papel); border-radius: var(--radio); padding: 20px; max-width: 380px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal-caja p { margin: 0 0 16px; color: var(--oscuro); font-weight: 500; }
  .modal-caja .acciones { justify-content: flex-end; }
  .modal .btn-sec { color: var(--oscuro); }
  .cargando { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: var(--crema); transition: opacity .3s; }
  .cargando.listo { opacity: 0; pointer-events: none; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--verde-claro); border-top-color: var(--oscuro); animation: gira .8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* ───────── Responsive ───────── */
  @media (min-width: 900px) {
    .topbar { max-width: 1120px; flex-direction: row; align-items: center; justify-content: space-between; padding-top: 24px; }
    .tabs { width: 380px; }
    .titulo { font-size: 30px; }
  }
  @media (max-width: 860px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 520px) {
    .pago { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .logo-1, .logo-2 { font-size: 26px; }
    .titulo { font-size: 23px; }
    .kpi-valor { font-size: 19px; }
    .btn { padding: 12px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation-duration: 0s !important; }
  }
</style>
